# Zapp Assist — configuration-as-data (Constitution: Future-Proofing, Config as data).
# Models, per-node effort, confidence thresholds, supported languages, and the pricing table
# all live here so behaviour is tunable without code changes.

# LLM provider (selects the isolated adapter — Constitution V). `anthropic` | `openai`.
# Set to `openai` for live testing (the Anthropic account is out of credits); flip back to
# `anthropic` + the claude-* models below once credits are available — no code change needed.
provider: openai

models:
  # Primary reasoning model (router, detector-assist, responder, verifier).
  primary: gpt-4o-mini
  # Swappable fallback for the hardest cases (higher quality, higher cost/latency).
  fallback: gpt-4o
  # Anthropic alternatives (used when provider: anthropic): primary claude-sonnet-5, fallback opus-5.

# Adaptive-thinking effort per node: low for cheap routing/detection, medium for answering/verifying.
node_effort:
  detect_language: low
  route_intent: low
  support_rag: medium
  onboarding: low
  action_plan: low
  verify_reply_language: low
  verify_confidence: medium

thresholds:
  # Below this combined confidence a turn is flagged needs_review=true.
  review_confidence: 0.6
  # Minimum fused language confidence to lock a session's active_lang.
  language_lock: 0.75
  # Minimum BM25 score for a retrieved KB snippet to count as grounding.
  grounding_min_score: 1.0
  # Multilingual policy (002): confidence floor for a turn to count toward a language switch.
  language_switch_min_confidence: 0.75
  # Consecutive confident turns in a different supported language required to switch active_lang.
  language_switch_turns: 2
  # A detection is "confident" (to lock or switch) when its absolute confidence clears the floor OR
  # its margin over the runner-up clears this. lingua normalises mass across candidates, so es/pt
  # split it and rarely reach an absolute 0.75 even when unambiguous — the margin rescues those.
  language_confident_min_margin: 0.15
  # A switch needs >= this many words. Single-word borrowed tokens (ok, thanks, obrigado) read as
  # confident in another language but are socially borrowed — the confidence floor can't catch them;
  # a genuine short switch ("i need help", "in english") is always >= 2 words. (sí/no are
  # already confidence-blocked, so the old char floor never saw them.)
  language_switch_min_words: 2
  # Replies shorter than this skip language verification (too short to detect reliably).
  reply_verify_min_chars: 15

languages:
  supported: [es, en, pt]
  fallback: en

# Pricing per 1,000,000 tokens (USD). `temperature_capable` marks the ONLY models that accept a
# `temperature` parameter — current Claude frontier models (sonnet-5 / opus-5) reject it (HTTP 400),
# so the LLM client forwards `temperature` solely to models flagged true here.
pricing:
  claude-sonnet-5:
    input_per_1m: 3.0
    output_per_1m: 15.0
    temperature_capable: false
  claude-opus-5:
    input_per_1m: 5.0
    output_per_1m: 25.0
    temperature_capable: false
  claude-haiku-4-5:
    input_per_1m: 1.0
    output_per_1m: 5.0
    temperature_capable: true
  # OpenAI models (temperature-capable, unlike current Claude frontier models).
  gpt-4o-mini:
    input_per_1m: 0.15
    output_per_1m: 0.60
    temperature_capable: true
  gpt-4o:
    input_per_1m: 2.5
    output_per_1m: 10.0
    temperature_capable: true

# Guardrail policy (003). `semantic_enabled` toggles the optional LLM semantic layer (off by default,
# so the deterministic regex layer alone runs and matches 001 behavior). `policy` holds per-rule
# overrides keyed by rule id — e.g. disable a noisy rule or change its action/severity without code:
#   policy:
#     off_topic: { enabled: false }
#     pii: { action: refuse, severity: high }
guardrails:
  semantic_enabled: false
  policy: {}

# Retrieval (hybrid RAG). `hybrid` fuses BM25 (lexical) + dense (embeddings) via Reciprocal Rank
# Fusion. It DEGRADES to BM25 when no embedding key is available (offline/CI), so tests and the eval
# stay deterministic; a live run with OPENAI_API_KEY set uses the full dense+sparse fusion.
retrieval:
  mode: hybrid          # bm25 | dense | hybrid
  embedder: openai      # OpenAI text-embedding-3-small (local sentence-transformers is a drop-in)
  vector_store: qdrant  # numpy (in-memory, zero-dep) | qdrant (real vector DB, embedded/in-process)
  qdrant_url: null      # null = embedded/in-process (no server); e.g. http://localhost:6333 = server
  top_k: 3
  rrf_k: 60             # Reciprocal Rank Fusion constant
  dense_min_similarity: 0.30   # cosine floor for a dense hit to count (keeps the decline gate)
  hype: true            # index each doc's hypothetical questions on the dense side (offline-safe)
  # LLM query expansion — opt-in; needs a key, degrades to the base retriever without one.
  rag_fusion: false     # rewrite the query into N phrasings and RRF-fuse their retrievals
  rag_fusion_queries: 3
  hyde: false           # draft a hypothetical answer passage and use it as an extra query
  self_query: false     # LLM classifies the query into a KB category, then filters candidates
  rerank: false         # LLM reranks the fused candidates by how well they answer the question
