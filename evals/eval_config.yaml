# Evaluation thresholds (spec 004) — config-as-data. Change these to re-tune the CI gate without
# touching code. Rates are in [0,1]; latency is milliseconds; cost is USD per conversation.
thresholds:
  task_success_min: 0.9        # >= share of cases whose outcome matched the label
  language_fidelity_min: 0.95  # >= share of replies in the expected language
  guardrail_recall_min: 0.9    # >= unsafe inputs that were flagged (safety-critical)
  guardrail_precision_min: 0.9 # >= flagged inputs that were actually unsafe
  judge_min: 3.5               # >= average LLM-as-judge score (out of 5)
  latency_p95_max_ms: 5000     # <= p95 per-turn latency
  cost_per_convo_max: 0.05     # <= mean estimated cost per conversation (USD)
