[project]
name = "zapp_assist"
version = "0.1.0"
description = "Zapp Assist — multilingual, production-minded conversational support agent (spec 001)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "lingua-language-detector>=2.0",
    "phonenumbers>=8.13",
    "rank-bm25>=0.2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=2.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
zapp-assist = "zapp_assist.cli:app"
zapp-eval = "evals.cli:app"
zapp-ingest = "zapp_assist.ingestion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zapp_assist", "evals"]

[tool.hatch.build.targets.wheel.force-include]
"src/zapp_assist/rag/kb" = "zapp_assist/rag/kb"
"src/zapp_assist/ingestion/enrichment_cache.json" = "zapp_assist/ingestion/enrichment_cache.json"
"evals/dataset" = "evals/dataset"
"evals/eval_config.yaml" = "evals/eval_config.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

# numpy (pulled in transitively by rank_bm25) ships stubs whose 3.12-only `type X = ...` syntax
# trips a mypy checked at python_version 3.11; skip following into it (it is not our code).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
